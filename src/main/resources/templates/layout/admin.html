<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Hệ thống Quản lý Danh mục - BT06</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            background-color: #212529;
            color: #f8f9fa;
        }
        .sidebar {
            min-height: calc(100vh - 220px);
        }
        .table-dark {
            --bs-table-bg: #2b3035;
            --bs-table-striped-bg: #32383e;
            --bs-table-hover-bg: #373e44;
        }
    </style>
</head>
<body class="bg-dark text-light d-flex flex-column min-vh-100">

    <!-- Header Fragment (contains student image/avatar) -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Main Content Container -->
    <div class="container-fluid flex-grow-1 mt-2 mb-4">
        <div class="row">
            <!-- Sidebar Fragment -->
            <div class="col-md-3 col-lg-2 ms-lg-3 mb-3">
                <div th:replace="~{fragments/sidebar :: sidebar}"></div>
            </div>

            <!-- Page Dynamic Content Fragment -->
            <main class="col-md-9 ms-sm-auto col-lg-9 px-md-4">
                <div layout:fragment="content">
                    <!-- Specific view content will be injected here -->
                </div>
            </main>
        </div>
    </div>

    <!-- Footer Fragment (contains student info) -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
