<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <title>Quản lý Danh mục</title>
</head>
<body>
    <div layout:fragment="content" class="mt-2">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <h3 class="text-warning mb-0 fw-bold">
                <i class="fa-solid fa-folder-open me-2"></i>Quản lý Danh Mục
            </h3>
            <a th:href="@{/admin/category/add}" class="btn btn-success fw-bold shadow-sm">
                <i class="fa-solid fa-plus me-1"></i> Thêm Danh Mục Mới
            </a>
        </div>

        <!-- Search Bar -->
        <div class="card bg-dark border-secondary mb-4 shadow-sm">
            <div class="card-body">
                <form th:action="@{/admin/categories}" method="get" class="row g-2 align-items-center">
                    <div class="col-md-9 col-sm-8">
                        <div class="input-group">
                            <span class="input-group-text bg-secondary border-secondary text-light">🔍</span>
                            <input type="text" name="keyword" class="form-control bg-dark text-light border-secondary"
                                   placeholder="Nhập tên danh mục cần tìm..." th:value="${keyword}">
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-4 d-flex gap-2">
                        <button type="submit" class="btn btn-warning fw-bold flex-grow-1 text-dark">Tìm kiếm</button>
                        <a th:if="${keyword != null and !keyword.isEmpty()}" th:href="@{/admin/categories}" class="btn btn-outline-light">Xóa lọc</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Search Alert -->
        <div th:if="${keyword != null and !keyword.isEmpty()}" class="alert alert-info py-2 mb-3">
            Kết quả tìm kiếm cho: <strong th:text="${keyword}"></strong> (Tìm thấy <strong th:text="${totalItems}"></strong> kết quả)
        </div>

        <!-- Categories Table -->
        <div class="table-responsive rounded shadow-sm">
            <table class="table table-dark table-striped table-hover border-secondary align-middle mb-0">
                <thead class="table-secondary text-dark">
                    <tr>
                        <th scope="col" style="width: 80px;" class="text-center">ID</th>
                        <th scope="col" style="width: 100px;" class="text-center">Hình Ảnh</th>
                        <th scope="col">Tên Danh Mục</th>
                        <th scope="col" style="width: 140px;" class="text-center">Trạng Thái</th>
                        <th scope="col" class="text-center" style="width: 180px;">Thao Tác</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(listcate)}">
                        <td colspan="5" class="text-center py-4 text-muted">
                            <i class="fa-solid fa-inbox fa-2x mb-2 d-block"></i>
                            Không tìm thấy danh mục nào phù hợp!
                        </td>
                    </tr>
                    <tr th:each="c : ${listcate}">
                        <td class="text-center fw-bold text-light" th:text="${c.categoryid}">1</td>
                        <td class="text-center">
                            <!-- Image handling: URL vs local uploaded image vs placeholder -->
                            <span th:if="${c.images != null and !c.images.isEmpty()}">
                                <img th:if="${c.images.startsWith('http')}"
                                     th:src="${c.images}"
                                     alt="Hình danh mục"
                                     class="img-thumbnail bg-dark border-secondary rounded"
                                     style="width: 60px; height: 60px; object-fit: cover;">
                                <img th:if="${!c.images.startsWith('http')}"
                                     th:src="@{/image(fname=${c.images})}"
                                     alt="Hình danh mục"
                                     class="img-thumbnail bg-dark border-secondary rounded"
                                     style="width: 60px; height: 60px; object-fit: cover;"
                                     onerror="this.src='/images/avatar.png';">
                            </span>
                            <div th:if="${c.images == null or c.images.isEmpty()}"
                                 class="bg-secondary rounded d-flex align-items-center justify-content-center text-muted mx-auto"
                                 style="width: 60px; height: 60px;">
                                <span class="small">N/A</span>
                            </div>
                        </td>
                        <td class="fw-bold fs-6 text-light" th:text="${c.categoryname}">Category Name</td>
                        <td class="text-center">
                            <span th:if="${c.status == 1}" class="badge bg-success px-2 py-1">Hoạt động</span>
                            <span th:if="${c.status != 1}" class="badge bg-danger px-2 py-1">Khóa</span>
                        </td>
                        <td class="text-center">
                            <a th:href="@{/admin/category/edit(id=${c.categoryid})}" class="btn btn-sm btn-primary me-1">
                                <i class="fa-solid fa-pen-to-square me-1"></i>Sửa
                            </a>
                            <a th:href="@{/admin/category/delete(id=${c.categoryid})}"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này?');">
                                <i class="fa-solid fa-trash me-1"></i>Xóa
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3 flex-wrap gap-2">
            <span class="text-muted small">
                Trang <strong th:text="${currentPage}">1</strong> / <strong th:text="${totalPages}">1</strong>
                (Tổng cộng <strong th:text="${totalItems}">0</strong> danh mục)
            </span>
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm mb-0">
                    <!-- Previous Page -->
                    <li class="page-item" th:classappend="${currentPage <= 1} ? 'disabled'">
                        <a class="page-link bg-dark text-light border-secondary"
                           th:href="@{/admin/categories(page=${currentPage - 1}, keyword=${keyword})}">« Trước</a>
                    </li>

                    <!-- Page numbers -->
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(1, totalPages)}"
                        th:classappend="${currentPage == i} ? 'active'">
                        <a th:if="${currentPage == i}"
                           class="page-link bg-warning text-dark border-warning fw-bold"
                           th:text="${i}">1</a>
                        <a th:if="${currentPage != i}"
                           class="page-link bg-dark text-light border-secondary"
                           th:href="@{/admin/categories(page=${i}, keyword=${keyword})}"
                           th:text="${i}">1</a>
                    </li>

                    <!-- Next Page -->
                    <li class="page-item" th:classappend="${currentPage >= totalPages} ? 'disabled'">
                        <a class="page-link bg-dark text-light border-secondary"
                           th:href="@{/admin/categories(page=${currentPage + 1}, keyword=${keyword})}">Sau »</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</body>
</html>
