<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-secondary mb-3 shadow-sm border-bottom border-warning">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-warning d-flex align-items-center" th:href="@{/admin/categories}">
            <i class="fa-solid fa-layer-group me-2 fs-4"></i> AK CATEGORY MANAGER
        </a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarAdmin">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarAdmin">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item">
                    <a class="nav-link text-light px-3" th:href="@{/admin/categories}">
                        <i class="fa-solid fa-house me-1"></i> Trang chủ
                    </a>
                </li>
                
                <!-- Student Avatar & Profile in Header -->
                <li class="nav-item ms-lg-2">
                    <div class="d-flex align-items-center bg-dark py-1 px-3 rounded-pill border border-warning">
                        <img th:src="@{/images/avatar.png}"
                             alt="Avatar"
                             class="rounded-circle me-2 border border-warning"
                             style="width: 36px; height: 36px; object-fit: cover;"
                             onerror="this.src='https://ui-avatars.com/api/?name=Tran+Anh+Khoa&background=ffc107&color=000';"/>
                        <div class="d-flex flex-column text-start">
                            <span class="fw-bold text-warning small">Trần Anh Khoa</span>
                            <span class="text-white-50" style="font-size: 0.72rem;">Admin / Sinh viên</span>
                        </div>
                    </div>
                </li>
                
                <li class="nav-item ms-lg-3">
                    <a class="btn btn-warning fw-bold text-dark btn-sm" th:href="@{/admin/categories}">
                        <i class="fa-solid fa-shield-halved me-1"></i> Quản trị
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
